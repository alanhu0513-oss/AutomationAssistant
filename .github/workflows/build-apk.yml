name: Build and Release Signed APK

on:
  push:
    branches: [ main ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Signed APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle Cache
        uses: gradle/actions/setup-gradle@v4

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Generate Signing Keystore (if not provided)
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkey -v -keystore ~/.android/debug.keystore -alias androiddebugkey -storepass android -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build Debug & Release APKs
        run: ./gradlew assembleDebug assembleRelease --stacktrace --no-daemon

      - name: Prepare Release Artifacts
        id: prepare_artifacts
        run: |
          mkdir -p release_assets

          # Get tag name or fallback
          TAG_NAME="${GITHUB_REF_NAME:-v2.2.0}"
          echo "Building for tag: $TAG_NAME"

          # Locate and copy debug APK
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk release_assets/app-debug.apk
          elif [ -f app/build/outputs/apk/debug/app-debug.debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.debug.apk release_assets/app-debug.apk
          elif [ -f aegis-shield-v2.2.0.apk ]; then
            cp aegis-shield-v2.2.0.apk release_assets/app-debug.apk
          fi

          # Locate and copy release APK or sign if needed
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk "release_assets/aegis-shield-${TAG_NAME}.apk"
            cp app/build/outputs/apk/release/app-release.apk "release_assets/aegis-shield-v2.2.0.apk"
          else
            cp release_assets/app-debug.apk "release_assets/aegis-shield-${TAG_NAME}.apk"
            cp release_assets/app-debug.apk "release_assets/aegis-shield-v2.2.0.apk"
          fi

          # Also create latest alias
          cp release_assets/app-debug.apk release_assets/aegis-shield-latest.apk

          echo "Prepared APK artifacts in release_assets/:"
          ls -la release_assets/

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Aegis-APK-Binaries
          path: release_assets/*.apk
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Built APK Artifacts
        uses: actions/download-artifact@v4
        with:
          name: Aegis-APK-Binaries
          path: release_assets

      - name: Publish GitHub Release with Attached APK
        uses: softprops/action-gh-release@v2
        with:
          name: "Aegis Shield ${{ github.ref_name || 'v2.2.0' }}"
          tag_name: ${{ github.ref_name || 'v2.2.0' }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release_assets/app-debug.apk
            release_assets/aegis-shield-v2.2.0.apk
            release_assets/aegis-shield-*.apk
            release_assets/aegis-shield-latest.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
